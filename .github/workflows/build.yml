name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: 
          - "1.24"
          - "1.25"
          - "1.26"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: unit-tests
        run: |
          go test -count=2 -race -covermode atomic -coverprofile=covprofile ./...
      - name: install-goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: send-coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=covprofile -service=github -parallel -flagname=Go-${{ matrix.test_number }}

  pin:
    name: pinned H3 version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: pinned H3 version agrees everywhere
        run: |
          want=$(cat H3_VERSION)
          upstream=v$(cat third_party/h3/VERSION)
          manifest=v$(jq -r .h3Version conformance/testdata/manifest.json)
          gitlink=$(git -C third_party/h3 rev-parse HEAD)
          # The peeled ref (^{}) exists only for annotated tags; ls-remote lists
          # it after the plain ref, so the last line is the commit either way.
          tagged=$(git ls-remote --tags https://github.com/uber/h3.git "refs/tags/$want" "refs/tags/$want^{}" | tail -1 | cut -f1)
          echo "H3_VERSION=$want upstream=$upstream manifest=$manifest gitlink=$gitlink tag=$tagged"
          test "$want" = "$upstream"
          test "$want" = "$manifest"
          test "$gitlink" = "$tagged"

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26
      - name: install-goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: finish-coverage-parallel
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -parallel-finish -service=github
